name: CI

on:
  # Branch pushes are covered by the pull_request run. Listing push without a
  # branch filter made every commit on a branch with an open PR run the whole
  # matrix twice, because the two events produce different concurrency refs.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify code formatting
        if: runner.os == 'Linux'
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted with gofmt:"
            gofmt -l .
            exit 1
          fi
      - run: go test ./...
      - name: Coverage floor
        if: runner.os == 'Linux'
        run: |
          go test -coverprofile=coverage.out ./... >/dev/null
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { print substr($3, 1, length($3)-1) }')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t + 0 < 90) ? 1 : 0 }' \
            || { echo "::error::coverage ${total}% is below the 90% floor advertised by the README badge"; exit 1; }
      - run: go test -race ./...
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...
      - run: go build -ldflags "-X main.version=ci" -o herdr-logbook${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/herdr-logbook
      - if: runner.os != 'Windows'
        run: bash -n scripts/open.sh scripts/install.sh
      - if: runner.os != 'Windows'
        run: bash scripts/open_test.sh
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          $allErrors = @()
          foreach ($script in @('scripts/open.ps1', 'scripts/install.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$parseErrors) | Out-Null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -gt 0) { $allErrors | Write-Error; exit 1 }
