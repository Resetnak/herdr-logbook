name: CodeQL Security Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Code scanning uploads require a public repo (or GitHub Advanced Security).
    # Skip on private repos so CI stays green; runs automatically once public.
    #
    # Dependabot pull requests get a read-only GITHUB_TOKEN no matter what this
    # workflow requests, so the SARIF upload fails with "Resource not accessible
    # by integration" and blocks the auto-merge. The push and schedule triggers
    # still scan the same code, so nothing goes unanalysed.
    if: github.event.repository.visibility == 'public' && github.actor != 'dependabot[bot]'

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
