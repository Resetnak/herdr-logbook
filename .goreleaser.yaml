version: 2
project_name: herdr-logbook
before:
  hooks:
    - go mod tidy
builds:
  - id: herdr-logbook
    main: ./cmd/herdr-logbook
    binary: herdr-logbook
    ldflags: -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
release:
  draft: false
  prerelease: auto
  header: |
    Install with the checksum-verifying script:

    ```bash
    curl -fsSL https://raw.githubusercontent.com/Resetnak/herdr-logbook/main/scripts/install.sh | bash
    ```

    or via the plugin manager: `herdr plugin install Resetnak/herdr-logbook`.
  footer: |
    ---

    Verify downloads against `checksums.txt`. Only macOS (arm64) is verified
    against a real Herdr host; WSL 2 (`linux/amd64`) is reported working.
    Native Linux and native Windows are cross-compiled and untested;
    see [docs/herdr-compatibility.md](https://github.com/Resetnak/herdr-logbook/blob/main/docs/herdr-compatibility.md).
