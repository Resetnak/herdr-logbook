id = "herdr-logbook"
name = "Herdr Logbook"
version = "0.0.1"
min_herdr_version = "0.7.0"
description = "Project-aware, local Markdown working memory for Herdr."
platforms = ["linux", "macos", "windows"]

[[build]]
platforms = ["linux", "macos"]
command = ["bash", "scripts/install.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/install.ps1"]

[[actions]]
id = "open"
platforms = ["linux", "macos"]
title = "Open Logbook Hub"
description = "Open project memory, preview notes, and search all registered projects."
contexts = ["workspace"]
command = ["bash", "scripts/open.sh", "hub"]

[[actions]]
id = "capture"
platforms = ["linux", "macos"]
title = "Capture project memory"
description = "Append a note to the active project's monthly inbox."
contexts = ["workspace"]
command = ["bash", "scripts/open.sh", "capture"]

[[actions]]
id = "open-windows"
platforms = ["windows"]
title = "Open Logbook Hub"
description = "Open project memory, preview notes, and search all registered projects."
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open.ps1", "hub-windows"]

[[actions]]
id = "capture-windows"
platforms = ["windows"]
title = "Capture project memory"
description = "Append a note to the active project's monthly inbox."
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open.ps1", "capture-windows"]

[[panes]]
id = "hub"
platforms = ["linux", "macos"]
title = "Herdr Logbook"
placement = "overlay"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-logbook\" tui"]

[[panes]]
id = "capture"
platforms = ["linux", "macos"]
title = "Capture Logbook"
placement = "overlay"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-logbook\" capture"]

[[panes]]
id = "compatibility"
platforms = ["linux", "macos"]
title = "Herdr Logbook Diagnostics"
placement = "overlay"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-logbook\" compatibility --wait"]

[[panes]]
id = "hub-windows"
platforms = ["windows"]
title = "Herdr Logbook"
placement = "overlay"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& (Join-Path $env:HERDR_PLUGIN_ROOT 'bin\\herdr-logbook.exe') tui"]

[[panes]]
id = "capture-windows"
platforms = ["windows"]
title = "Capture Logbook"
placement = "overlay"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& (Join-Path $env:HERDR_PLUGIN_ROOT 'bin\\herdr-logbook.exe') capture"]

[[panes]]
id = "compatibility-windows"
platforms = ["windows"]
title = "Herdr Logbook Diagnostics"
placement = "overlay"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& (Join-Path $env:HERDR_PLUGIN_ROOT 'bin\\herdr-logbook.exe') compatibility --wait"]
