version = 1

[storage]
# Project storage mode: "central" (stored under state directory) or "repo" (stored in project)
project_mode = "central"
repo_directory = ".herdr/logbook"

[editor]
# External editor command (e.g. ["nvim"], ["vim"], ["nano"], ["code", "--wait"])
# Leave empty to auto-detect from $HERDR_LOGBOOK_EDITOR, $VISUAL, or $EDITOR
command = []

[ui]
# TUI Color Theme: "auto", "dracula", "tokyo-night", "nord", or "default"
theme = "auto"
# Markdown Preview Style: "auto", "dark", "light", or "notty"
preview_style = "auto"
# Show Git branch name in the TUI status bar
show_branch = true
# Width of the Scopes pane in columns (default: 24)
scope_width = 24
# Default TUI view tab on launch: "now", "project", "global", or "all"
default_view = "now"
[search]
max_index_file_bytes = 262144
max_preview_file_bytes = 2097152

[capture]
max_selection_bytes = 524288
include_branch = true
include_source_cwd = true
